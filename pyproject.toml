[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-gpt"
version = "0.1.0"
description = "A minimal GPT transformer language model implemented from scratch in PyTorch with custom byte-level BPE and KV-cache decoding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zein" }]
keywords = ["transformer", "gpt", "deep-learning", "pytorch", "language-model", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
]
media = [
    "python-pptx>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
